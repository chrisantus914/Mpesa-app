<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-Pesa Payment</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#159447;
    color:white;
    text-align:center;
    padding:25px;
}

.container{
    padding:20px;
    max-width:500px;
    margin:auto;
}

.balance{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.amount{
    font-size:30px;
    font-weight:bold;
    color:#159447;
}

.payment-box{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.payment-box h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

.pay-button{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:0;
    border-radius:10px;
    background:#159447;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.pay-button:hover{
    background:#117b3a;
}

#status{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:20px;
}

.grid button{
    padding:18px;
    border:0;
    border-radius:12px;
    background:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>M-Pesa</h1>
    <p>Mobile Money App</p>
</header>

<div class="container">

    <div class="balance">
        <h2>Available Balance</h2>
        <div class="amount">KSh 0.00</div>
    </div>

    <div class="payment-box">
        <h2>Send Money</h2>

        <label for="phone">M-Pesa Phone Number</label>
        <input
            type="tel"
            id="phone"
            placeholder="e.g. 0712345678"
            maxlength="12"
        >

        <label for="amount">Amount (KSh)</label>
        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="1"
        >

        <button class="pay-button" onclick="startPayment()">
            Pay with M-Pesa
        </button>

        <div id="status"></div>
    </div>

    <div class="grid">
        <button>Buy Airtime</button>
        <button>Pay Bill</button>
        <button>Withdraw</button>
        <button>Transaction History</button>
    </div>

</div>

<script>
function startPayment(){

    const phone = document.getElementById("phone").value.trim();
    const amount = document.getElementById("amount").value.trim();
    const status = document.getElementById("status");

    if(phone === ""){
        status.innerText = "Please enter your M-Pesa phone number.";
        return;
    }

    if(amount === "" || Number(amount) < 1){
        status.innerText = "Please enter a valid amount.";
        return;
    }

    status.innerText = "Payment request is being prepared...";

    /*
      Daraja API connection will be added here
      through a secure backend.
    */
}
</script>

</body>
</html>
