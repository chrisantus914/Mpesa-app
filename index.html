<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-Pesa</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#159447;color:white;text-align:center;padding:25px}
.container{padding:20px;max-width:500px;margin:auto}
.balance{background:white;padding:20px;border-radius:15px;margin-bottom:20px}
.amount{font-size:30px;font-weight:bold;color:#159447}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
button{padding:20px;border:0;border-radius:12px;background:white;font-size:16px;font-weight:bold}
</style>
</head><body><header>
<h1>M-Pesa</h1>
<p>Mobile Money App</p>
</header><div class="container"><div class="balance">
<h2>Available Balance</h2>
<div class="amount">KSh 0.00</div>
</div><div class="grid">
<button>Send Money</button>
<button>Buy Airtime</button>
<button>Pay Bill</button>
<button>Withdraw</button>
</div></div></body>
</html>
